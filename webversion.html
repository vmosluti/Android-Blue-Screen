<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>蓝屏</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0078D7;
      font-family: "Microsoft Yahei", "Segoe UI", Roboto, system-ui, sans-serif;
    }


    .bsod-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 6vh 5vw;
      color: white;
      transition: opacity 0.2s;
      background-color: #0078D7;
      overflow: hidden;
    }


    .bsod-wrapper p, 
    .bsod-wrapper .text-block {
      color: white;
      line-height: 1.6;
    }

    /* 表情 */
    .cry-face {
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 1.5vh;
      flex-shrink: 0;
    }


    .main-msg {
      font-size: clamp(1.1rem, 3.2vw, 2.2rem);
      margin-bottom: 0.6rem;
      font-weight: 400;
      white-space: pre-wrap;
      word-break: break-word;
    }


    .progress-text {
      font-size: clamp(1.8rem, 5vw, 3.8rem);
      font-weight: 500;
      margin: 2vh 0 2.5vh 0;
      transition: color 0.25s;
      flex-shrink: 0;
    }
    .progress-text.crashing {
      color: #ff3b3b;
    }


    .info-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: clamp(1.2rem, 4vw, 3.5rem);
      width: 100%;
      margin-top: 1.5vh;
      flex-wrap: nowrap;
    }


    .qr-box {
      width: clamp(100px, 18vw, 200px);
      height: clamp(100px, 18vw, 200px);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(1px);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    }


    .info-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: clamp(0.9rem, 2.2vw, 1.4rem);
    }

    .info-details .url {
      word-break: break-all;
      opacity: 0.9;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 0.5rem;
      margin-bottom: 0.3rem;
      font-size: clamp(0.8rem, 1.8vw, 1.2rem);
    }

    .info-details .error-tag {
      background: rgba(0, 0, 0, 0.25);
      display: inline-block;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-family: "Courier New", monospace;
      letter-spacing: 0.5px;
      font-size: clamp(0.8rem, 1.6vw, 1.1rem);
      margin-top: 0.2rem;
      align-self: flex-start;
    }

    
    .footer-note {
      margin-top: auto;
      padding-top: 2vh;
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: right;
      font-size: clamp(0.6rem, 1.2vw, 1rem);
      opacity: 0.5;
      flex-shrink: 0;
    }


    #rotate-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 9999;
      backdrop-filter: blur(6px);
      background: rgba(255, 255, 255, 0.85);  /* 雪峰白 */
      text-align: center;
      padding: 2rem;
      font-family: "Segoe UI", "Microsoft Yahei", sans-serif;
    }

    #rotate-overlay .rotate-icon {
      font-size: clamp(4rem, 15vw, 8rem);
      margin-bottom: 1rem;
      animation: rotate-phone 2.4s ease-in-out infinite;
    }

    #rotate-overlay .rotate-text {
      font-size: clamp(1.4rem, 4vw, 2.8rem);
      font-weight: 500;
      letter-spacing: 2px;
      margin-top: 60px;
      background: linear-gradient(135deg, #000000, #4b5cc4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #rotate-overlay .rotate-sub {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      margin-top: 1rem;
      opacity: 0.7;
      color: #4b5cc4;
    }


    @keyframes rotate-phone {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(90deg); }
      75% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }

/*这么好的遮罩你咋不早点告诉我*/
    @media (orientation: portrait) {
      #rotate-overlay {
        display: flex !important;
      }

      .bsod-wrapper {
        filter: blur(3px) brightness(0.6);
        pointer-events: none;
      }
    }

    /* 横屏下遮罩隐藏，蓝屏正常 */
    @media (orientation: landscape) {
      #rotate-overlay {
        display: none !important;
      }
      .bsod-wrapper {
        filter: none;
        pointer-events: auto;
      }
    }


    @media (max-width: 600px) and (orientation: landscape) {
      .bsod-wrapper {
        padding: 3vh 3vw;
      }
      .info-row {
        gap: 1.5rem;
      }
      .qr-box {
        width: 80px;
        height: 80px;
      }
    }


    @media (max-height: 450px) and (orientation: landscape) {
      .cry-face {
        font-size: 3.2rem;
        margin-bottom: 0.2rem;
      }
      .main-msg {
        font-size: 0.9rem;
        line-height: 1.4;
      }
      .progress-text {
        font-size: 1.6rem;
        margin: 0.5vh 0;
      }
      .info-details {
        font-size: 0.75rem;
        gap: 0.2rem;
      }
      .qr-box {
        width: 70px;
        height: 70px;
      }
      .footer-note {
        padding-top: 0.5vh;
      }
    }
  </style>
</head>
<body>

  
  <div id="rotate-overlay">
    <div class="rotate-icon">✌🏻😋✌🏻</div>
    <div class="rotate-text">转屏，OK？</div>
    <div class="rotate-sub">我命令你把屏幕给我转过来</div>
    
  </div>


  <div class="bsod-wrapper" id="bsodContainer">
    <div class="cry-face">:(</div>
    <p class="main-msg">你的设备遇到问题，需要重启。<br>我们只展示某些错误信息，然后你可以重新启动。</p>
    <div class="progress-text" id="progressDisplay">12% 完成</div>
        <div class="info-row">
      <div class="qr-box">■ □ ■</div>
      <div class="info-details">
        <p style="margin:0;">有关此问题的详细信息和可能的解决方法，请访问</p>
        <div class="url">https://molaos.rth1.xyz/niulai.html</div>

        <p style="margin: 0.5px 0 0 0;">如果询问技术人员，请向他们提供以下信息</p>
        <span class="error-tag">Crazy Thursday, vivo 50</span>
      </div>
    </div>

    <div class="footer-note">错误代码 · 0x000000F4 &nbsp;|&nbsp; 横屏模式</div>
  </div>

  <script>
    (function() {
      "use strict";

      const container = document.getElementById('bsodContainer');
      const progressDisplay = document.getElementById('progressDisplay');

    
      let progress = 12;
      let isCrashing = false;
      let timer = null;
      let crashTimer = null;

      // 进度++++到厌倦
      function updateProgressDisplay() {
        if (isCrashing) return;
        progressDisplay.textContent = `${progress}% 完成`;
        progressDisplay.classList.remove('crashing');
      }


      function startProgress() {
        if (timer) return;

        timer = setInterval(() => {
          if (isCrashing) return;

          if (progress < 99) {
            progress += 1;
            updateProgressDisplay();
          }

          
          if (progress >= 99 && !isCrashing) {
            isCrashing = true;
            progressDisplay.classList.add('crashing');
            progressDisplay.textContent = '99% 完成';

            if (timer) {
              clearInterval(timer);
              timer = null;
            }

            // 延迟500ms 模拟 killProcess
            crashTimer = setTimeout(() => {
              // 淡出消失
              container.style.transition = 'opacity 0.4s ease';
              container.style.opacity = '0';
              // 完全隐藏（模拟进程终止）
              setTimeout(() => {
                container.style.display = 'none';
              }, 450);
            }, 500);
          }
        }, 300);
      }

      // 重启功能 (双击蓝屏区域重新初始化)
      function restartBSOD() {
        // 清理所有计时器
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        if (crashTimer) {
          clearTimeout(crashTimer);
          crashTimer = null;
        }

        // 重置状态
        progress = 12;
        isCrashing = false;
        container.style.display = 'flex';
        container.style.opacity = '1';
        container.style.transition = 'none';
        progressDisplay.classList.remove('crashing');
        progressDisplay.textContent = '12% 完成';

        // 重新启动
        startProgress();
      }

      // 监听双击重启
      container.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        restartBSOD();
        // 小反馈
        container.style.transition = 'background-color 0.15s';
        container.style.backgroundColor = '#006ec0';
        setTimeout(() => {
          container.style.backgroundColor = '#0078D7';
        }, 150);
      });

      // 启动
      startProgress();

      // 暴露重启到控制台 (方便调试)
      window.restartBSOD = restartBSOD;

      console.log('💙 蓝屏强制横屏已启动 · 双击蓝屏区域可重启模拟');
    })();
  </script>

</body>
</html>
